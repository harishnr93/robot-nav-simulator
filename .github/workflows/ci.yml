name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 python3-venv

      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Build (Release)
        run: |
          cmake -S . -B build
          cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

      - name: Demo smoke test
        run: .venv/bin/python python/run_demo.py --save-gif

      - name: Sanitizer build and test
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DAMR_PYTHON_TESTS=OFF \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build build-asan -j
          # The acceptance tests (about 1000 simulations each) run in the Release step;
          # under the sanitizers in Debug they would take hours.
          ctest --test-dir build-asan --output-on-failure -LE acceptance

      - name: Upload demo results
        uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: results/

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (standalone simulator, Python tools, ROS 2 package)
        run: docker build --build-arg INSTALL_RVIZ=false -t robot-nav-sim .

      - name: All tests inside the image (CTest + ROS 2)
        run: docker run --rm robot-nav-sim test

      - name: Standalone CLI and demo inside the image
        run: |
          docker run --rm robot-nav-sim robot_simulator --map maps/obstacles.csv --start 1 1 --goal 18 18
          mkdir -p docker-results
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/docker-results:/ws/results" robot-nav-sim demo
          test -s docker-results/navigation.gif
